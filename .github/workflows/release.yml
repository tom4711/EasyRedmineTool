name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EasyRedmineTool.slnx

      - name: Build
        run: dotnet build EasyRedmineTool.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test EasyRedmineTool.slnx --no-build --configuration Release --verbosity normal

  release-windows:
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows x64
        run: >
          dotnet publish src/EasyRedmineTool.Desktop/EasyRedmineTool.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          --output publish/win-x64

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $archive = "EasyRedmineTool-$version-win-x64.zip"
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath $archive
          echo "ARCHIVE_NAME=$archive" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: EasyRedmineTool-${{ github.ref_name }}-win-x64
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 90

  release-macos:
    needs: validate
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish macOS arm64 and x64 (single-file)
        run: |
          set -euo pipefail
          for rid in osx-arm64 osx-x64; do
            dotnet publish src/EasyRedmineTool.Desktop/EasyRedmineTool.Desktop.csproj \
              --configuration Release \
              --runtime "$rid" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              --output "publish/$rid"
          done

      - name: Create universal binary
        run: |
          set -euo pipefail
          rm -rf publish/osx-universal
          cp -R publish/osx-arm64 publish/osx-universal
          lipo -create \
            publish/osx-arm64/EasyRedmineTool.Desktop \
            publish/osx-x64/EasyRedmineTool.Desktop \
            -output publish/osx-universal/EasyRedmineTool.Desktop
          chmod +x publish/osx-universal/EasyRedmineTool.Desktop
          lipo -info publish/osx-universal/EasyRedmineTool.Desktop
          # Every Mach-O in the universal output must contain both architectures.
          macho_count=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              macho_count=$((macho_count + 1))
              archs=$(lipo -archs "$f")
              echo "$f: $archs"
              if [[ " $archs " != *" x86_64 "* || " $archs " != *" arm64 "* ]]; then
                echo "::error::Not a universal binary (archs: $archs): $f"
                exit 1
              fi
            fi
          done < <(find publish/osx-universal -type f -print0)
          if [[ "$macho_count" -eq 0 ]]; then
            echo "::error::No Mach-O files found in publish/osx-universal"
            exit 1
          fi
          rm -rf publish/osx-arm64 publish/osx-x64

      - name: Sign and notarize
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE_BASE64}" || -z "${APPLE_API_KEY_BASE64}" ]]; then
            echo "::error::macOS signing secrets missing. See docs/MACOS_SIGNING.md"
            exit 1
          fi
          # Full version (e.g. 1.0.0-beta.1) -> CFBundleShortVersionString;
          # the script derives a numeric-only CFBundleVersion (1.0.0) from it.
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          chmod +x scripts/macos-sign-notarize.sh
          scripts/macos-sign-notarize.sh "publish/osx-universal"

      - name: Create ZIP archive
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          archive="EasyRedmineTool-${version}-osx-universal.zip"
          cp docs/macos-starten.txt publish/osx-universal/macos-starten.txt
          (cd publish/osx-universal && zip -ry "../../${archive}" EasyRedmineTool.app macos-starten.txt)
          echo "ARCHIVE_NAME=${archive}" >> "$GITHUB_ENV"
          ls -lh "${archive}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: EasyRedmineTool-${{ github.ref_name }}-osx-universal
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 90

  release-linux:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Linux ${{ matrix.rid }}
        run: >
          dotnet publish src/EasyRedmineTool.Desktop/EasyRedmineTool.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          --output publish/${{ matrix.rid }}

      - name: Create tar.gz archive
        run: |
          version="${{ github.ref_name }}"
          archive="EasyRedmineTool-${version}-${{ matrix.rid }}.tar.gz"
          tar -czf "${archive}" -C "publish/${{ matrix.rid }}" .
          echo "ARCHIVE_NAME=${archive}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: EasyRedmineTool-${{ github.ref_name }}-${{ matrix.rid }}
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 90

  create-release:
    needs: [release-windows, release-macos, release-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: EasyRedmineTool-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: EasyRedmineTool ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
